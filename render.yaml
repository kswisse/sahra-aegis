services:
  - type: web
    name: sahra-aegis
    env: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT --app-dir web
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
